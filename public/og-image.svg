<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a1515"/>
      <stop offset="50%" stop-color="#672020"/>
      <stop offset="100%" stop-color="#7a2d2d"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f6d365"/>
      <stop offset="100%" stop-color="#fda085"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Border accent -->
  <rect x="24" y="24" width="1152" height="582" rx="16" fill="none" stroke="rgba(253, 216, 133, 0.3)" stroke-width="2"/>
  <rect x="32" y="32" width="1136" height="566" rx="12" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>

  <!-- Brand Badge -->
  <g transform="translate(80, 80)">
    <rect width="280" height="36" rx="18" fill="rgba(255,255,255,0.1)" stroke="rgba(253, 216, 133, 0.4)" stroke-width="1"/>
    <circle cx="18" cy="18" r="6" fill="#f6d365"/>
    <text x="34" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#f6d365" letter-spacing="1.5">BAR COUNCIL REG. PH/1260/2025</text>
  </g>

  <!-- Main Title -->
  <text x="80" y="200" font-family="'Playfair Display', Georgia, serif" font-size="58" font-weight="700" fill="#ffffff" letter-spacing="-0.5">
    Advocate Richa Dhanda
  </text>

  <!-- Subtitle -->
  <text x="80" y="255" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="500" fill="#fce7af">
    Expert Immigration Lawyer &amp; Legal Consultant
  </text>

  <text x="80" y="295" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="rgba(255,255,255,0.8)">
    Kurukshetra, Haryana · High Court of Punjab &amp; Haryana · Nationwide Services
  </text>

  <!-- Divider -->
  <line x1="80" y1="335" x2="1120" y2="335" stroke="rgba(253, 216, 133, 0.3)" stroke-width="1"/>

  <!-- Practice Areas Pills -->
  <g transform="translate(80, 365)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="220" height="52" rx="10" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <text x="110" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">🎓 Student Visa</text>

    <!-- Pill 2 -->
    <rect x="235" y="0" width="220" height="52" rx="10" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <text x="345" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">💼 Work Permit</text>

    <!-- Pill 3 -->
    <rect x="470" y="0" width="240" height="52" rx="10" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <text x="590" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">🌍 PR &amp; Express Entry</text>

    <!-- Pill 4 -->
    <rect x="725" y="0" width="240" height="52" rx="10" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <text x="845" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">⚖️ Refusal Appeals</text>
  </g>

  <!-- Footer Info Bar -->
  <g transform="translate(80, 520)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="600" fill="#ffffff">
      🌐 www.advocaterichadhanda.com
    </text>
    <text x="400" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="rgba(255,255,255,0.75)">
      Book Online Consultation · Instant Slot Confirmation
    </text>
  </g>

  <!-- Decorative Scale of Justice Graphic -->
  <g transform="translate(970, 110)" stroke="#f6d365" stroke-width="3" fill="none" opacity="0.85">
    <line x1="80" y1="20" x2="80" y2="180" stroke-linecap="round"/>
    <line x1="20" y1="50" x2="140" y2="50" stroke-linecap="round"/>
    <circle cx="80" cy="20" r="8" fill="#f6d365"/>
    <path d="M 50 180 L 110 180" stroke-linecap="round"/>
    <!-- Left Pan -->
    <line x1="20" y1="50" x2="5" y2="105"/>
    <line x1="20" y1="50" x2="35" y2="105"/>
    <path d="M 0 105 Q 20 125 40 105 Z" fill="rgba(246, 211, 101, 0.2)"/>
    <!-- Right Pan -->
    <line x1="140" y1="50" x2="125" y2="105"/>
    <line x1="140" y1="50" x2="155" y2="105"/>
    <path d="M 120 105 Q 140 125 160 105 Z" fill="rgba(246, 211, 101, 0.2)"/>
  </g>
</svg>
